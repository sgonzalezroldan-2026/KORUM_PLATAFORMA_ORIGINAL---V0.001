<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" role="img" aria-label="KORUM Sello de Custodia Escolar y Quórum">
  <defs>
    <!-- Gradiente Paño Marino de Sudadera Colegial -->
    <radialGradient id="sealVarsityBg" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1B2F52"/>
      <stop offset="65%" stop-color="#101F38"/>
      <stop offset="100%" stop-color="#080F1D"/>
    </radialGradient>
    
    <!-- Oro Colegial Deportivo -->
    <linearGradient id="sealGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Verde Esmeralda Custodia Protegida -->
    <linearGradient id="sealEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <filter id="sealShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#sealShadow)">
    <!-- Base Circular de Sello de Custodia Escolar -->
    <circle cx="60" cy="60" r="54" fill="url(#sealVarsityBg)"/>

    <!-- Pespunte Exterior de Hilo Bordado -->
    <circle cx="60" cy="60" r="50.5" stroke="url(#sealGold)" stroke-width="1.8" stroke-dasharray="3.5, 2" fill="none"/>
    <circle cx="60" cy="60" r="46.5" stroke="#FDFBF7" stroke-width="1" stroke-opacity="0.75" fill="none"/>
  </g>

  <!-- Escudo Central Varsity Heritage -->
  <g transform="translate(32, 28) scale(0.56)">
    <!-- Silueta Exterior del Escudo -->
    <path d="M50 6 L82 13 C83.5 13.3 84.5 14.7 84.5 16.3 V45 C84.5 64 69 77.5 51.5 86 C50.5 86.5 49.5 86.5 48.5 86 C31 77.5 15.5 64 15.5 45 V16.3 C15.5 14.7 16.5 13.3 18 13 L50 6 Z" 
          fill="#0C172A" stroke="url(#sealGold)" stroke-width="2"/>

    <!-- Laureles Cívicos -->
    <g fill="url(#sealGold)" opacity="0.9">
      <path d="M28 48 C26 44 26 38 29 35 C28 38 29 42 32 44 C30 46 29 47 28 48 Z"/>
      <path d="M26 39 C23 35 24 29 28 26 C26 29 28 34 31 35 C29 37 27 38 26 39 Z"/>
      <path d="M72 48 C74 44 74 38 71 35 C72 38 71 42 68 44 C70 46 71 47 72 48 Z"/>
      <path d="M74 39 C77 35 76 29 72 26 C74 29 72 34 69 35 C71 37 73 38 74 39 Z"/>
    </g>

    <!-- Letra K Universitaria -->
    <path d="M37 25 H45 V43 L57 25 H67 L53 45 L68 67 H58 L45 48 V67 H37 V25 Z" fill="#FFFFFF"/>
    <path d="M39.5 28.5 H42.5 V44.5 L55.5 28.5 H61.5 L49.5 45.5 L62.5 63.5 H56.5 L43.5 47 V63.5 H39.5 V28.5 Z" 
          stroke="url(#sealGold)" stroke-width="1.2" fill="none"/>
  </g>

  <!-- Insignia Central Inferior: Check Verde de Custodia Mancomunada -->
  <circle cx="60" cy="81" r="7.5" fill="url(#sealEmerald)" stroke="#FFFFFF" stroke-width="1.2"/>
  <path d="M56 81 L59 84 L64 78" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Leyenda Circular de Seguridad Escolar -->
  <path id="sealTextPathTop" d="M 22 60 A 38 38 0 0 1 98 60" fill="none"/>
  <path id="sealTextPathBottom" d="M 98 60 A 38 38 0 0 1 22 60" fill="none"/>
  
  <text font-family="'Plus Jakarta Sans', sans-serif" font-size="5.5" font-weight="800" fill="#FDFBF7" letter-spacing="1.2">
    <textPath href="#sealTextPathTop" startOffset="50%" text-anchor="middle">
      CUSTODIA ESCOLAR MANCOMUNADA
    </textPath>
  </text>
  <text font-family="'Plus Jakarta Sans', sans-serif" font-size="5" font-weight="800" fill="url(#sealGold)" letter-spacing="1.2">
    <textPath href="#sealTextPathBottom" startOffset="50%" text-anchor="middle">
      ★ 100% GARANTÍA DE DEVOLUCIÓN ★
    </textPath>
  </text>
</svg>
