<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" role="img" aria-label="KORUM Cuaderno Stamp - Sello Escolar de Aprobación">
  <defs>
    <!-- Textura de tinta azul escolar (Azul tinta de pluma Pilot/Bic escolar) -->
    <linearGradient id="inkNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>

    <!-- Tinta Roja de Corrección / Aprobado Escolar -->
    <linearGradient id="stampCoral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
  </defs>

  <!-- Pauta de Cuaderno Escolar de Fondo (Rayas guía suaves estilo libreta Lamela/Montessori) -->
  <g opacity="0.18">
    <line x1="12" y1="28" x2="88" y2="28" stroke="#1E3A8A" stroke-width="0.8"/>
    <line x1="12" y1="42" x2="88" y2="42" stroke="#1E3A8A" stroke-width="0.8" stroke-dasharray="2, 2"/>
    <line x1="12" y1="56" x2="88" y2="56" stroke="#1E3A8A" stroke-width="0.8" stroke-dasharray="2, 2"/>
    <line x1="12" y1="70" x2="88" y2="70" stroke="#1E3A8A" stroke-width="0.8"/>
    <!-- Margen Rojo Clásico de Cuaderno Escolar -->
    <line x1="26" y1="10" x2="26" y2="90" stroke="#DC2626" stroke-width="1.2"/>
  </g>

  <!-- Doble Círculo de Sello de Goma Colegial Entintado (Ligera imperfección orgánica de sello físico) -->
  <circle cx="54" cy="50" r="38" stroke="url(#inkNavy)" stroke-width="2.5" stroke-dasharray="28 2 30 1.5 25 2" fill="none" transform="rotate(-3 54 50)"/>
  <circle cx="54" cy="50" r="33.5" stroke="url(#inkNavy)" stroke-width="1.2" fill="none" opacity="0.8" transform="rotate(-3 54 50)"/>

  <!-- Estrellitas de Mérito Escolar ("Buen Trabajo") -->
  <g fill="url(#stampCoral)" transform="rotate(-3 54 50)">
    <!-- Estrella Izquierda -->
    <polygon points="26,50 27.5,53.5 31,54 28.5,56.5 29,60 26,58.2 23,60 23.5,56.5 21,54 24.5,53.5"/>
    <!-- Estrella Derecha -->
    <polygon points="82,50 83.5,53.5 87,54 84.5,56.5 85,60 82,58.2 79,60 79.5,56.5 77,54 80.5,53.5"/>
  </g>

  <!-- Letra 'K' de Trazo Firme con Puntas Suaves y Puntos de Quórum -->
  <g id="cuadernoLetterK" transform="rotate(-3 54 50)">
    <!-- Barra Vertical del Cuaderno (Columna vertebral de la comunidad) -->
    <rect x="40" y="27" width="7" height="46" rx="2" fill="url(#inkNavy)"/>
    
    <!-- Brazo Superior Inclinado -->
    <path d="M48 48 L65 29 C66 28 67.5 28 68.5 29 L70 31 C70.8 32 70.5 33.5 69.5 34.5 L55 49 Z" fill="url(#inkNavy)"/>
    
    <!-- Brazo Inferior Inclinado -->
    <path d="M53 47 L69 68 C69.8 69 69.8 70.5 69 71.5 L67.5 73 C66.5 74 65 74 64 73 L48 53 Z" fill="url(#inkNavy)"/>

    <!-- Corazón/Grapa Central de Aprobación Escolar en Tinta Roja -->
    <circle cx="51.5" cy="50" r="3.2" fill="url(#stampCoral)"/>
  </g>

  <!-- Arco de Texto Arqueado del Sello: 'KORUM · QUÓRUM COLEGIAL' -->
  <path id="stampTextPathTop" d="M 24 50 A 30 30 0 0 1 84 50" fill="none"/>
  <path id="stampTextPathBottom" d="M 84 50 A 30 30 0 0 1 24 50" fill="none"/>
  
  <text font-family="'Plus Jakarta Sans', sans-serif" font-size="5" font-weight="800" fill="url(#inkNavy)" letter-spacing="1.5">
    <textPath href="#stampTextPathTop" startOffset="50%" text-anchor="middle">
      KORUM · COMUNIDAD ESCOLAR
    </textPath>
  </text>
  <text font-family="'Plus Jakarta Sans', sans-serif" font-size="4.5" font-weight="700" fill="url(#stampCoral)" letter-spacing="1.2">
    <textPath href="#stampTextPathBottom" startOffset="50%" text-anchor="middle">
      ★ APROBADO EN PATIO ★
    </textPath>
  </text>
</svg>
